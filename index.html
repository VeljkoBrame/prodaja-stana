<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stan na prodaju</title>
  <meta name="description" content="Oglas za prodaju stana — fotografije, opis, lokacija i kontakt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <header class="top">
    <div class="wrap top__inner">
      <span class="top__brand">Na prodaju</span>
      <a class="top__call" id="topCall" href="#kontakt">Kontakt</a>
    </div>
  </header>

  <main class="wrap">
    <section class="mosaic" id="mosaic" aria-label="Fotografije"></section>

    <div class="layout">
      <article class="content">
        <p class="eyebrow" id="adresa"></p>
        <h1 id="naslov"></h1>
        <p class="lead" id="podnaslov"></p>

        <dl class="facts" id="osnovno"></dl>

        <section class="block">
          <h2>O stanu</h2>
          <div class="prose" id="opis"></div>
        </section>

        <section class="block" id="raspored" hidden>
          <h2>Raspored</h2>
          <div class="plan">
            <button class="plan__img" id="planBtn" aria-label="Uvećaj plan stana"><img id="planImg" alt="Plan stana" loading="lazy"></button>
            <table class="rooms" id="prostorije"></table>
          </div>
        </section>

        <section class="block">
          <h2>Karakteristike</h2>
          <ul class="features" id="karakteristike"></ul>
        </section>

        <section class="block">
          <h2>Sve fotografije</h2>
          <div class="gallery" id="galerija"></div>
        </section>

        <section class="block">
          <h2>Lokacija</h2>
          <div class="map"><iframe id="mapa" title="Mapa lokacije" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
        </section>
      </article>

      <aside class="side" id="kontakt">
        <div class="card">
          <p class="card__label">Cena</p>
          <p class="card__price" id="cena"></p>
          <p class="card__sub" id="cenaM2"></p>
          <p class="card__note" id="napomenaCena"></p>
          <hr>
          <p class="card__name" id="kontaktIme"></p>
          <p class="card__role" id="kontaktUloga"></p>
          <div class="actions" id="akcije"></div>
          <p class="card__note" id="kontaktNapomena"></p>
        </div>
      </aside>
    </div>
  </main>

  <footer class="wrap foot">
    <span id="footAdresa"></span>
  </footer>

  <div class="bar" id="bar">
    <div>
      <span class="bar__price" id="barCena"></span>
    </div>
    <a class="btn btn--primary" id="barCall">Pozovi</a>
  </div>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Pregled fotografija">
    <button class="lb__close" id="lbClose" aria-label="Zatvori">×</button>
    <button class="lb__nav lb__prev" id="lbPrev" aria-label="Prethodna">‹</button>
    <figure class="lb__fig">
      <img id="lbImg" alt="">
      <figcaption><span id="lbCap"></span><span id="lbCount"></span></figcaption>
    </figure>
    <button class="lb__nav lb__next" id="lbNext" aria-label="Sledeća">›</button>
  </div>

  <script src="podaci.js"></script>
  <script src="app.js"></script>
</body>
</html>
